# WirePlumber workaround for Redmagic DAO TWS QCC3086 USB Dongle (19d2:0616)
# Fixes:
#  1. Prevents PipeWire from suspending the USB sink (avoids USB UAC1 clock/re-init glitches).
#  2. Lowers priority of the dongle's 16 kHz capture mic so apps do not silently hijack it
#     and force the 2.4 GHz radio link into robotic low-bandwidth bidirectional voice mode.
#
# Install:
#   cp dao-tws-dongle.conf ~/.config/wireplumber/wireplumber.conf.d/
#   systemctl --user restart wireplumber

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.usb-Qualcomm_DAO_TWS_.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        audio.rate = 48000
        audio.format = "S24_3LE"
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_input.usb-Qualcomm_DAO_TWS_.*"
      }
    ]
    actions = {
      update-props = {
        priority.driver = 100
        priority.session = 100
        node.description = "DAO TWS Mic (16kHz Voice Mode)"
      }
    }
  }
]
